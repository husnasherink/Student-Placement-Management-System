
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Placement Portal</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #142b4a, #2563eb);
        }

        .login-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px #0003;
        }

        h1 {
            text-align: center;
            color: #142b4a;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Student Login</h1>
        <p class="subtitle">Welcome to the Placement Portal</p>

        <form id="loginForm">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>
       <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">

        <a class="back" href="index.html">← Back to Home</a>
    </div>

    <script>
    document.querySelector("form").addEventListener("submit", function(event) {
        event.preventDefault();
        window.location.href = "dashboard.html";
    });
</script>
</body>
</html>
